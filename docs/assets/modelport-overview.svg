<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">ModelPort request execution and accounting</title>
<desc id="desc">Four execution stages above a PostgreSQL ledger. One client request can have several Provider attempts, each with a separate budget reservation. Dashed connectors show record relationships, not additional execution steps.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2858c5" stroke-width="1.8"/></marker>
<style>
.title{font:700 49px 'Segoe UI',sans-serif;fill:#fff}.sub{font:400 23px 'Segoe UI',sans-serif;fill:#bdc9df}
.label{font:700 18px 'Consolas',monospace;letter-spacing:2px;fill:#2858c5}.h{font:650 28px 'Segoe UI',sans-serif;fill:#172b4a}
.body{font:400 22px 'Segoe UI',sans-serif;fill:#4c5b70}.mono{font:400 21px 'Consolas',monospace;fill:#2858c5}
.small{font:400 19px 'Segoe UI',sans-serif;fill:#526277}.white{fill:#fff}.muted{fill:#bed0ec}
</style></defs>
<rect width="1500" height="1000" fill="#f5f4f0"/>
<rect width="1500" height="141" fill="#132744"/>
<rect x="56" y="40" width="5" height="60" fill="#7fa9ff"/>
<text x="82" y="78" class="title">ModelPort</text>
<text x="82" y="113" class="sub">Request execution, failure handling, and accounting</text>
<text x="1190" y="69" class="label muted">RUST / AXUM</text>
<text x="1190" y="102" class="small muted">SELF-HOSTED GATEWAY</text>

<rect x="56" y="197" width="320" height="270" rx="5" fill="#fff" stroke="#d5dce5" stroke-width="1.5"/>
<rect x="56" y="197" width="320" height="5" fill="#2858c5"/>
<text x="76" y="239" class="label">01 / ACCEPT</text>
<text x="76" y="281" class="h">Validate the request</text>
<text x="76" y="326" class="small">Client key + tenant scope</text>
<text x="76" y="360" class="small">Messages / Chat Completions</text>
<text x="76" y="394" class="small">Typed exchange + Tool Use</text>
<text x="76" y="438" class="small">src/exchange.rs</text>
<rect x="412" y="197" width="320" height="270" rx="5" fill="#fff" stroke="#d5dce5" stroke-width="1.5"/>
<rect x="412" y="197" width="320" height="5" fill="#2858c5"/>
<text x="432" y="239" class="label">02 / PLAN + CLAIM</text>
<text x="432" y="281" class="h">Own the execution</text>
<text x="432" y="326" class="small">Resolve candidate routes</text>
<text x="432" y="360" class="small">Idempotency + fingerprint</text>
<text x="432" y="394" class="small">Request record + lease</text>
<text x="432" y="438" class="small">src/routes/client_api.rs</text>
<rect x="768" y="197" width="320" height="270" rx="5" fill="#fff" stroke="#d5dce5" stroke-width="1.5"/>
<rect x="768" y="197" width="320" height="5" fill="#2858c5"/>
<text x="788" y="239" class="label">03 / EXECUTE</text>
<text x="788" y="281" class="h">Admit each attempt</text>
<text x="788" y="326" class="small">Capability + cooldown checks</text>
<text x="788" y="360" class="small">Reserve before upstream I/O</text>
<text x="788" y="394" class="small">Bounded eligible fallback</text>
<text x="788" y="438" class="small">src/enterprise_ledger.rs</text>
<rect x="1124" y="197" width="320" height="270" rx="5" fill="#fff" stroke="#d5dce5" stroke-width="1.5"/>
<rect x="1124" y="197" width="320" height="5" fill="#2858c5"/>
<text x="1144" y="239" class="label">04 / FINALIZE</text>
<text x="1144" y="281" class="h">Close the lifecycle</text>
<text x="1144" y="326" class="small">JSON result / stream terminal</text>
<text x="1144" y="360" class="small">Failure / downstream cancel</text>
<text x="1144" y="394" class="small">Finalize once; release permit</text>
<text x="1144" y="438" class="small">src/stream_lifecycle.rs</text>
<path d="M382 324 H405" fill="none" stroke="#2858c5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M738 324 H761" fill="none" stroke="#2858c5" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1094 324 H1117" fill="none" stroke="#2858c5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="56" y="177" class="label">CLAUDE CODE / SDK / INTERNAL AGENT</text>
<path d="M572 467 V493 H236 V535" fill="none" stroke="#8293ab" stroke-width="1.8" stroke-dasharray="5 5"/>
<path d="M928 467 V493 H707 V535" fill="none" stroke="#8293ab" stroke-width="1.8" stroke-dasharray="5 5"/>
<path d="M1284 467 V493 H1230 V535" fill="none" stroke="#8293ab" stroke-width="1.8" stroke-dasharray="5 5"/>
<rect x="56" y="535" width="1388" height="362" rx="5" fill="#fff" stroke="#bac9de" stroke-width="1.5"/>
<rect x="56" y="535" width="1388" height="53" fill="#e9eef8"/>
<text x="80" y="570" class="label">POSTGRESQL LEDGER</text>
<text x="805" y="570" class="small">Dashed lines = execution-to-record relationships</text>
<path d="M434 611 V871 M989 611 V871" stroke="#d5dce5" stroke-width="1.5"/>
<text x="80" y="628" class="label">ONE CLIENT REQUEST</text>
<text x="80" y="674" class="h">Gateway Request</text>
<text x="80" y="716" class="mono">grq_example</text>
<text x="80" y="757" class="body">Identity + tenant scope</text>
<text x="80" y="792" class="body">Overall state + usage</text>
<text x="80" y="827" class="body">Idempotency + lease</text>
<text x="462" y="628" class="label">ONE OR MORE ATTEMPTS</text>
<rect x="462" y="650" width="499" height="79" rx="5" fill="#fff7e8" stroke="#e9d4ad" stroke-width="1.5"/>
<text x="482" y="681" class="mono">att_01 / Provider A</text>
<text x="482" y="711" class="small">Recoverable failure; cost evidence retained</text>
<rect x="462" y="747" width="499" height="79" rx="5" fill="#eef4ff" stroke="#c4d4f3" stroke-width="1.5"/>
<text x="482" y="778" class="mono">att_02 / Provider B</text>
<text x="482" y="808" class="small">Completed; usage source recorded</text>
<text x="462" y="862" class="small">Illustrative two-attempt relationship</text>
<text x="1018" y="628" class="label">BUDGET PER ATTEMPT</text>
<text x="1018" y="674" class="h">Reserve → resolve</text>
<text x="1018" y="718" class="body">Admission estimate</text>
<text x="1018" y="753" class="body">Settlement / release event</text>
<text x="1018" y="788" class="body">Usage + price provenance</text>
<text x="1018" y="823" class="body">Expiry → unreconciled state</text>
<path d="M80 924 H1444" stroke="#cdd5df"/>
<text x="80" y="957" class="body">Inspect the parent request, every attempt, and the evidence behind estimated cost.</text>
</svg>
